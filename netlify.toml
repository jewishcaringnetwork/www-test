#:schema https://open-api.netlify.com/netlify.schema.json
#:tombi schema.strict = false

[dev]
targetPort = 3000
autoLaunch = false

# frame-src only, so far: it governs iframes and nothing else, since no
# default-src or child-src is set. Fonts, scripts, styles and images are
# unaffected. A full CSP is a separate job.
# - jewishcaringnetwork.admirepro.app: the donation form on /donate (ADR 6)
# - app.netlify.com: the Netlify Drawer on deploy previews
[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "frame-src 'self' https://jewishcaringnetwork.admirepro.app https://app.netlify.com"

# Old WordPress URLs to v1 pages, from the posts and pages in the WordPress
# database dump (2026-10-15). Mapping notes: docs/wordpress-redirects.md.
#
# Netlify uses the first rule that matches and ignores trailing slashes, so
# exact paths come before each section's catch-all. A `/section/*` rule also
# matches `/section` itself, so sections whose path is still a v1 route
# (/donate, /get-involved, /contact) list their old children one by one.

# About JCN
[[redirects]]
from = "/about-jcn/history-mission"
to = "/about/history"
status = 301

[[redirects]]
